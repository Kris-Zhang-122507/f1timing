# Temporary: test run of the FIA document collector. Safe to delete.
name: Probe FIA access
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect
        run: |
          which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          node scripts/fia.mjs 2>&1 | tee fia-log.txt
          mkdir out && cp -r public/data/fia out/ && cp fia-log.txt out/
          cd out && git init -q . && git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/probe
