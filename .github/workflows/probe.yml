# Temporary: checks which free F1 data sources are reachable and browser-friendly.
name: Probe data sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          check() {
            code=$(curl -s -o /tmp/body -w "%{http_code}" -H "Origin: https://kris-zhang-122507.github.io" "$1")
            cors=$(curl -s -D - -o /dev/null -H "Origin: https://kris-zhang-122507.github.io" "$1" | grep -i "access-control-allow-origin" | tr -d '\r')
            size=$(wc -c < /tmp/body)
            echo "::notice::$code size=$size cors=[$cors] $1 :: $(head -c 160 /tmp/body | tr '\n' ' ')"
          }
          check "https://api.openf1.org/v1/sessions?year=2026&country_name=Singapore"
          check "https://api.openf1.org/v1/sessions?year=2026&session_name=Race"
          check "https://api.jolpi.ca/ergast/f1/2026.json"
          check "https://livetiming-mirror.fastf1.dev/static/2026/2026-10-04_Bahrain_Grand_Prix/2026-10-04_Race/TimingData.jsonStream"
          check "https://livetiming.formula1.com/static/2026/Index.json"
          check "https://api.open-meteo.com/v1/forecast?latitude=1.29&longitude=103.86&minutely_15=precipitation&forecast_minutely_15=4"
