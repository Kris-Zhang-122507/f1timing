# Temporary: checks which free data sources are reachable from GitHub's servers.
name: Probe data sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          check() {
            code=$(curl -sL -o /tmp/body -w "%{http_code}" -A "Mozilla/5.0" "$1")
            echo "::notice::$code size=$(wc -c < /tmp/body) $1 :: $(head -c 140 /tmp/body | tr '\n\r' '  ')"
          }
          statuses() {
            curl -s "https://api.jolpi.ca/ergast/f1/2026/results.json?limit=100&offset=$1" | python3 -c "import sys,json,collections; d=json.load(sys.stdin); c=collections.Counter(r['status'] for race in d['MRData']['RaceTable']['Races'] for r in race['Results']); print('::notice::statuses offset $1: '+str(dict(c)))"
          }
          statuses 0; statuses 100; statuses 200; statuses 300
          check "https://www.formula1.com/en/latest/all.xml"
          check "https://www.motorsport.com/rss/f1/news/"
          check "https://www.autosport.com/rss/f1/news/"
          check "https://www.the-race.com/formula-1/feed/"
          check "https://www.racefans.net/feed/"
          check "https://www.fia.com/documents/championships/fia-formula-one-world-championship-14/season/season-2026-2073"
          check "https://www.fia.com/documents/championships/fia-formula-one-world-championship-14"
          check "https://api.openf1.org/v1/sessions?year=2026&session_name=Race"
