# Every hour: download any newly finished sessions from F1's timing archive into
# public/data/ so the site can replay them. Also refreshes the season schedule.
# Run it by hand from the Actions tab ("Archive sessions" → Run workflow) to backfill more.
name: Archive sessions

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      meetings:
        description: "How many recent race weekends to check"
        default: "4"

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download finished sessions
        run: node scripts/archive.mjs "" "${{ github.event.inputs.meetings || '4' }}"
      - name: Latest headlines
        run: node scripts/news.mjs
      - name: Pit stop cost per circuit
        run: node scripts/pitloss.mjs --history 0 12
        continue-on-error: true
      - name: Save new data
        run: |
          git config user.name "undercut-archive"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Archive: update sessions and schedule"
            git pull --rebase
            git push
          fi
