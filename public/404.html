<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off track — RaceLimit Live</title>
<link rel="icon" type="image/png" sizes="32x32" href="/racelimit-live/favicon-32.png">
<meta name="theme-color" content="#0B0D12">
<script>
  // Old links into the public/ folder — send those straight to the same page without it.
  (function () {
    var base = "/racelimit-live/", p = location.pathname;
    if (p.indexOf(base + "public/") === 0 || p === base + "public") {
      location.replace(base + p.slice((base + "public/").length) + location.search + location.hash);
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0B0D12; --card: #13161D; --line: #262B36; --text: #E8EAF0; --soft: #C3C9D4; --muted: #9AA3B2; --faint: #6B7383; --accent: #FFB547; --red: #FF4D4D; --blue: #3B63C4; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Barlow", system-ui, sans-serif; display: grid; place-items: center; padding: 24px 16px; }
  main { width: min(640px, 100%); display: flex; flex-direction: column; gap: 22px; }
  .brand { font: 700 18px "Barlow Condensed", sans-serif; letter-spacing: .18em; color: var(--accent); }
  .brand span { color: var(--red); font-size: 13px; letter-spacing: .14em; }
  h1 { margin: 0; font: 700 clamp(64px, 18vw, 120px)/0.9 "JetBrains Mono", monospace; letter-spacing: -.04em; }
  h1 span { color: var(--red); }
  .lead { margin: 0; font: 600 clamp(22px, 5vw, 28px)/1.2 "Barlow Condensed", sans-serif; letter-spacing: .02em; }
  .muted { color: var(--muted); }

  /* the lap strip, with the last lap red-flagged */
  .strip { display: flex; gap: 3px; }
  .strip i { flex: 1 1 0; height: 12px; border-radius: 2px; background: var(--blue); opacity: 0; animation: lap .25s ease-out forwards; }
  .strip i.off { background: var(--red); box-shadow: 0 0 0 2px var(--text); animation: lap .25s ease-out forwards, blink 1s 1.6s steps(2, start) 3; }
  @keyframes lap { to { opacity: 1; } }
  @keyframes blink { to { visibility: hidden; } }

  /* a race control message */
  .rc { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--red); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }
  .rc-top { display: flex; gap: 10px; font: 600 11px "Barlow", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .rc-top b { color: var(--red); }
  .rc-msg { font: 600 14px/1.45 "JetBrains Mono", monospace; color: var(--soft); }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 8px; text-decoration: none; font: 600 15px "Barlow", sans-serif; border: 1px solid var(--line); color: var(--text); background: var(--card); }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #17120A; }
  a.btn:hover { filter: brightness(1.1); }
  a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  footer { font-size: 12px; color: var(--faint); }
  @media (prefers-reduced-motion: reduce) { .strip i { animation: none; opacity: 1; } }
</style>
</head>
<body>
<main>
  <div class="brand">RACELIMIT <span>LIVE</span></div>
  <div class="strip" id="strip" aria-hidden="true"></div>
  <div>
    <h1>4<span>0</span>4</h1>
    <p class="lead">This page went off track.</p>
  </div>
  <div class="rc" role="note">
    <div class="rc-top"><b>Race control</b><span id="rcTime"></span></div>
    <div class="rc-msg">PAGE <span id="rcPath"></span> TIME DELETED — TRACK LIMITS AT TURN 404. NO FURTHER ACTION.</div>
  </div>
  <p class="muted">The address doesn't lead anywhere on RaceLimit Live. It may be an old link, or a typo.</p>
  <div class="actions">
    <a class="btn primary" href="/racelimit-live/">Back to the pit lane →</a>
  </div>
  <footer>Unofficial fan project. Not associated with Formula 1.</footer>
</main>
<script>
  var strip = document.getElementById("strip"), html = "";
  for (var i = 0; i < 24; i++) html += '<i class="' + (i === 23 ? "off" : "") + '" style="animation-delay:' + (i * 0.05).toFixed(2) + 's' + (i === 23 ? ', 1.6s' : '') + '"></i>';
  strip.innerHTML = html;
  var now = new Date();
  document.getElementById("rcTime").textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  var path = decodeURIComponent(location.pathname.replace(/^\/racelimit-live/, "")) || "/";
  document.getElementById("rcPath").textContent = (path.length > 40 ? path.slice(0, 39) + "…" : path).toUpperCase();
</script>
</body>
</html>
